<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>칭찬 릴레이</title>
<style>
*{box-sizing:border-box}
/* DB그룹 CI: DB Green(RGB 0,133,74 · Pantone 7732C)이 주색, 심볼의 오렌지는 강조색이에요. */
:root{--brand:#00854A;--brand-dark:#006237;--brand-soft:#E6F3EC;--accent:#F47920;--ink:#1F2A24;--muted:#66706A;--line:#D5E2DA;--bg:#F7FAF8;--error:#C0392B}
body{font-family:"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;margin:0}
main{max-width:760px;margin:48px auto;padding:0 16px}
small.kicker{font-weight:700;letter-spacing:.14em;color:var(--accent)}
h1{font-size:clamp(32px,6vw,48px);letter-spacing:-.04em;line-height:1.2;margin:8px 0}
h1.title{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
h1.title img{height:.9em;width:auto}
p.lead{color:var(--muted);margin-top:0}
form{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:24px}
label{display:block;font-weight:700;margin-top:16px}
label:first-child{margin-top:0}
label span{font-weight:400;color:var(--muted);font-size:13px}
input,textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:6px;background:var(--bg)}
input:focus,textarea:focus{outline:2px solid var(--brand);border-color:transparent}
button{width:100%;margin-top:20px;padding:14px;background:linear-gradient(90deg,var(--brand),#00A05A);color:#fff;border:0;border-radius:14px;font:inherit;font-weight:700;cursor:pointer}
button:disabled{background:var(--line);color:var(--muted);cursor:wait}
.msg{min-height:1.6em;margin:10px 0 0;font-size:14px}
.msg.error{color:var(--error)}
.msg.ok{color:var(--brand-dark)}
.list-head{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:40px;flex-wrap:wrap}
.list-head h2{margin:0;font-size:22px}
.list-head input{width:auto;flex:1;min-width:180px;max-width:280px;margin:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:16px;padding:0;list-style:none}
.card{background:#fff;border:1px solid var(--line);border-top:4px solid var(--brand);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.card .message{margin:0;white-space:pre-wrap;word-break:break-word}
.card .tag{align-self:flex-start;background:var(--brand-soft);color:var(--brand-dark);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
.card .meta{margin-top:auto;font-size:13px;color:var(--muted)}
.card .meta strong{color:var(--ink)}
.empty{grid-column:1/-1;color:var(--muted);text-align:center;padding:32px 0}
</style></head>
<body><main>
<small class="kicker">DB INC · PRAISE RELAY</small>
<h1 class="title">칭찬 릴레이<img src="/static/db-logo.png" alt="DB Inc." onerror="this.remove()"></h1>
<p class="lead">함께한 사람에게 칭찬 한마디를 남기고, 다음 사람에게 이어 주세요.</p>

<form id="form" novalidate>
  <label for="name">보내는 사람</label>
  <input id="name" maxlength="40" autocomplete="off" placeholder="이름이나 별칭" required>
  <label for="message">칭찬 한마디</label>
  <textarea id="message" rows="3" maxlength="500" placeholder="고마웠던 점, 멋졌던 점을 적어 주세요" required></textarea>
  <label for="tag">칭찬 태그 <span>(선택)</span></label>
  <input id="tag" maxlength="30" autocomplete="off" placeholder="예: #협업 #열정">
  <button id="submit" type="submit">칭찬 남기기</button>
  <p id="formMsg" class="msg" role="status"></p>
</form>

<div class="list-head">
  <h2>받은 칭찬</h2>
  <input id="search" type="search" placeholder="이름·내용·태그 검색" aria-label="칭찬 검색">
</div>
<p id="listMsg" class="msg error" role="alert"></p>
<ul id="cards" class="cards"></ul>
</main>
<script>
const $ = (id) => document.getElementById(id);
const form = $("form"), submit = $("submit"), formMsg = $("formMsg");
const cards = $("cards"), listMsg = $("listMsg"), search = $("search");

function setMsg(el, text, kind) {
  el.textContent = text;
  el.className = "msg" + (kind ? " " + kind : "");
}

function formatTime(iso) {
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString("ko-KR", { month: "long", day: "numeric", hour: "2-digit", minute: "2-digit" });
}

// 사용자가 쓴 글은 textContent로만 넣어요. HTML로 해석하지 않아요.
function renderCard(entry) {
  const li = document.createElement("li");
  li.className = "card";
  if (entry.tag) {
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = entry.tag;
    li.append(tag);
  }
  const message = document.createElement("p");
  message.className = "message";
  message.textContent = entry.message;
  const meta = document.createElement("div");
  meta.className = "meta";
  const who = document.createElement("strong");
  who.textContent = entry.name;
  meta.append(who, " · " + formatTime(entry.created_at));
  li.append(message, meta);
  return li;
}

async function readError(res) {
  try { return (await res.json()).error || `오류가 났어요. (${res.status})`; }
  catch { return `오류가 났어요. (${res.status})`; }
}

async function loadEntries() {
  const q = search.value.trim();
  try {
    const res = await fetch("/api/entries" + (q ? "?q=" + encodeURIComponent(q) : ""));
    if (!res.ok) throw new Error(await readError(res));
    const { entries } = await res.json();
    setMsg(listMsg, "", "error");
    cards.replaceChildren(...entries.map(renderCard));
    if (!entries.length) {
      const empty = document.createElement("li");
      empty.className = "empty";
      empty.textContent = q ? "찾는 칭찬이 없어요." : "아직 칭찬이 없어요. 첫 칭찬을 남겨 주세요!";
      cards.append(empty);
    }
  } catch (err) {
    setMsg(listMsg, "목록을 불러오지 못했어요. " + (err.message || ""), "error");
  }
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = $("name").value.trim(), message = $("message").value.trim(), tag = $("tag").value.trim();
  if (!name || !message) {
    setMsg(formMsg, "보내는 사람과 칭찬 한마디를 모두 적어 주세요.", "error");
    return;
  }
  submit.disabled = true;
  submit.textContent = "저장하는 중…";
  setMsg(formMsg, "");
  try {
    const body = { name, message };
    if (tag) body.tag = tag;
    const res = await fetch("/api/entries", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error(await readError(res));
    $("message").value = "";
    $("tag").value = "";
    setMsg(formMsg, "칭찬을 남겼어요!", "ok");
    await loadEntries();
  } catch (err) {
    setMsg(formMsg, err.message || "서버에 연결하지 못했어요.", "error");
  } finally {
    submit.disabled = false;
    submit.textContent = "칭찬 남기기";
  }
});

let searchTimer;
search.addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(loadEntries, 250);
});

loadEntries();
</script>
</body></html>
